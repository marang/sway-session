name: LAB-281 inert running and cancellation probe
'on':
  push:
    branches:
    - feature/lab-281-r3-veroffentlichungen-an-erfolgreiche-prufungen-des-exakten
permissions:
  contents: read
jobs:
  waiting_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  waiting_verify:
    runs-on: ubuntu-latest
    needs: waiting_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "Verification still running"; sleep 180; echo "commit=1111111111111111111111111111111111111111"
        >> "$GITHUB_OUTPUT"
  waiting_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - waiting_resolve
    - waiting_verify
    if: ${{ needs.waiting_verify.outputs.commit == needs.waiting_resolve.outputs.commit
      }}
  waiting_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - waiting_resolve
    - waiting_verify
    if: ${{ needs.waiting_verify.outputs.commit == needs.waiting_resolve.outputs.commit
      }}
  waiting_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - waiting_resolve
    - waiting_verify
    - waiting_build
    if: ${{ needs.waiting_verify.outputs.commit == needs.waiting_resolve.outputs.commit
      }}
