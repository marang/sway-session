name: LAB-281 inert production gate probe
'on':
  push:
    branches:
    - feature/lab-281-r3-veroffentlichungen-an-erfolgreiche-prufungen-des-exakten
permissions:
  contents: read
jobs:
  success_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  success_verify:
    runs-on: ubuntu-latest
    needs: success_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  success_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - success_resolve
    - success_verify
    if: ${{ needs.success_verify.outputs.commit == needs.success_resolve.outputs.commit
      }}
  success_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - success_resolve
    - success_verify
    if: ${{ needs.success_verify.outputs.commit == needs.success_resolve.outputs.commit
      }}
  success_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - success_resolve
    - success_verify
    - success_build
    if: ${{ needs.success_verify.outputs.commit == needs.success_resolve.outputs.commit
      }}
  failed_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  failed_verify:
    runs-on: ubuntu-latest
    needs: failed_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: exit 1
  failed_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - failed_resolve
    - failed_verify
    if: ${{ needs.failed_verify.outputs.commit == needs.failed_resolve.outputs.commit
      }}
  failed_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - failed_resolve
    - failed_verify
    if: ${{ needs.failed_verify.outputs.commit == needs.failed_resolve.outputs.commit
      }}
  failed_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - failed_resolve
    - failed_verify
    - failed_build
    if: ${{ needs.failed_verify.outputs.commit == needs.failed_resolve.outputs.commit
      }}
  skipped_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  skipped_verify:
    runs-on: ubuntu-latest
    needs: skipped_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
    if: ${{ false }}
  skipped_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - skipped_resolve
    - skipped_verify
    if: ${{ needs.skipped_verify.outputs.commit == needs.skipped_resolve.outputs.commit
      }}
  skipped_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - skipped_resolve
    - skipped_verify
    if: ${{ needs.skipped_verify.outputs.commit == needs.skipped_resolve.outputs.commit
      }}
  skipped_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - skipped_resolve
    - skipped_verify
    - skipped_build
    if: ${{ needs.skipped_verify.outputs.commit == needs.skipped_resolve.outputs.commit
      }}
  missing_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  missing_verify:
    runs-on: ubuntu-latest
    needs: missing_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "No verified commit output"
  missing_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - missing_resolve
    - missing_verify
    if: ${{ needs.missing_verify.outputs.commit == needs.missing_resolve.outputs.commit
      }}
  missing_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - missing_resolve
    - missing_verify
    if: ${{ needs.missing_verify.outputs.commit == needs.missing_resolve.outputs.commit
      }}
  missing_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - missing_resolve
    - missing_verify
    - missing_build
    if: ${{ needs.missing_verify.outputs.commit == needs.missing_resolve.outputs.commit
      }}
  wrong_sha_resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=1111111111111111111111111111111111111111" >> "$GITHUB_OUTPUT"
  wrong_sha_verify:
    runs-on: ubuntu-latest
    needs: wrong_sha_resolve
    outputs:
      commit: ${{ steps.result.outputs.commit }}
    steps:
    - id: result
      run: echo "commit=2222222222222222222222222222222222222222" >> "$GITHUB_OUTPUT"
  wrong_sha_build:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - wrong_sha_resolve
    - wrong_sha_verify
    if: ${{ needs.wrong_sha_verify.outputs.commit == needs.wrong_sha_resolve.outputs.commit
      }}
  wrong_sha_goreleaser:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - wrong_sha_resolve
    - wrong_sha_verify
    if: ${{ needs.wrong_sha_verify.outputs.commit == needs.wrong_sha_resolve.outputs.commit
      }}
  wrong_sha_publish_aur:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Inert publication marker; no credentials or effects"
    needs:
    - wrong_sha_resolve
    - wrong_sha_verify
    - wrong_sha_build
    if: ${{ needs.wrong_sha_verify.outputs.commit == needs.wrong_sha_resolve.outputs.commit
      }}
  assert:
    if: ${{ always() }}
    needs:
    - success_goreleaser
    - success_publish_aur
    - failed_goreleaser
    - failed_publish_aur
    - skipped_goreleaser
    - skipped_publish_aur
    - missing_goreleaser
    - missing_publish_aur
    - wrong_sha_goreleaser
    - wrong_sha_publish_aur
    runs-on: ubuntu-latest
    steps:
    - run: 'test "${{ needs.success_goreleaser.result }}" = "success"

        test "${{ needs.success_publish_aur.result }}" = "success"

        test "${{ needs.failed_goreleaser.result }}" = "skipped"

        test "${{ needs.failed_publish_aur.result }}" = "skipped"

        test "${{ needs.skipped_goreleaser.result }}" = "skipped"

        test "${{ needs.skipped_publish_aur.result }}" = "skipped"

        test "${{ needs.missing_goreleaser.result }}" = "skipped"

        test "${{ needs.missing_publish_aur.result }}" = "skipped"

        test "${{ needs.wrong_sha_goreleaser.result }}" = "skipped"

        test "${{ needs.wrong_sha_publish_aur.result }}" = "skipped"'
