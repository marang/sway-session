name: Verified AUR publication

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: Publish an existing release or verify release-sync permissions
        required: true
        default: publish-release
        type: choice
        options:
          - publish-release
          - verify-sync-token
      version:
        description: Existing release tag to publish, for example v0.1.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: aur-release
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.operation == 'publish-release') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - name: Checkout workflow source without persisted credentials
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve requested immutable release tag on main
        id: tag
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          cp scripts/resolve-release-tag.sh "$RUNNER_TEMP/resolve-release-tag.sh"
          git checkout --detach "refs/tags/$VERSION"
          if [ -n "$EXPECTED_COMMIT" ]; then
            sh "$RUNNER_TEMP/resolve-release-tag.sh" "$VERSION" "$EXPECTED_COMMIT" >> "$GITHUB_OUTPUT"
          else
            sh "$RUNNER_TEMP/resolve-release-tag.sh" "$VERSION" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}

  build:
    name: Build and verify package
    needs: [resolve, verify]
    if: ${{ needs.verify.outputs.commit == needs.resolve.outputs.commit }}
    runs-on: ubuntu-latest
    container: archlinux:latest

    env:
      VERSION: ${{ needs.resolve.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.resolve.outputs.commit }}

    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git go pacman-contrib openssh curl sudo

      - name: Checkout source repo
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and main ancestry
        run: |
          if ! printf '%s\n' "$VERSION" | \
            grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Refusing malformed release tag: $VERSION" >&2
            exit 1
          fi
          if ! git -c safe.directory="$GITHUB_WORKSPACE" \
            show-ref --verify --quiet "refs/tags/$VERSION"; then
            echo "Refusing unknown release tag: $VERSION" >&2
            exit 1
          fi
          tag_commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-list -n 1 "$VERSION")
          head_commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
          if [ "$tag_commit" != "$EXPECTED_COMMIT" ]; then
            echo 'Release tag changed after verification.' >&2
            exit 1
          fi
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "Checkout does not match release tag $VERSION." >&2
            exit 1
          fi
          if ! git -c safe.directory="$GITHUB_WORKSPACE" \
            merge-base --is-ancestor "$tag_commit" origin/main; then
            echo 'Refusing to publish a tag whose commit is not on main.' >&2
            exit 1
          fi

      - name: Strip leading v from tag
        id: v
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Bump PKGBUILD version and checksum
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
        run: |
          ver="$RELEASE_VERSION"
          sed -i "s/^pkgver=.*/pkgver=${ver}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse 'HEAD^{commit}')
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo 'Refusing an invalid release commit.' >&2
            exit 1
          fi
          # Older immutable tags predate build metadata; keep their reruns usable.
          if grep -q '^_commit=' PKGBUILD; then
            sed -i "s/^_commit=.*/_commit=${commit}/" PKGBUILD
            grep -Fx "_commit=${commit}" PKGBUILD
          fi

          # Pin makepkg's source and extracted directory to the verified commit,
          # even if a tag moves after checkout. Accept only known recipe forms.
          tag_source='source=("sway-session-$pkgver.tar.gz::$url/archive/refs/tags/v$pkgver.tar.gz")'
          if ! grep -Fx "$tag_source" PKGBUILD >/dev/null && \
            ! grep -Eq '^source=\("sway-session-\$pkgver\.tar\.gz::\$url/archive/[0-9a-f]{40}\.tar\.gz"\)$' PKGBUILD; then
            echo 'Refusing an unsupported package source template.' >&2
            exit 1
          fi
          directory_pattern='^[[:space:]]*cd "sway-session-(\$pkgver|[0-9a-f]{40})"$'
          if [ "$(grep -Ec "$directory_pattern" PKGBUILD)" -ne 3 ]; then
            echo 'Refusing unsupported package source directories.' >&2
            exit 1
          fi
          sed -i "s|^source=.*|source=(\"sway-session-\$pkgver.tar.gz::\$url/archive/${commit}.tar.gz\")|" PKGBUILD
          sed -i -E 's@^([[:space:]]*)cd "sway-session-(\$pkgver|[0-9a-f]{40})"$@\1cd "sway-session-'"${commit}"'"@' PKGBUILD

          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/${commit}.tar.gz"
          sum=$(curl -fsSL "$tarball" | sha256sum | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD

          grep -Fx "pkgver=${ver}" PKGBUILD
          grep -Fx 'pkgrel=1' PKGBUILD
          grep -Fx "sha256sums=('${sum}')" PKGBUILD
          if grep -F 'SKIP' PKGBUILD; then
            echo 'Refusing to publish a PKGBUILD with skipped integrity checks.' >&2
            exit 1
          fi

      - name: Create non-root build user
        run: |
          useradd -m build
          echo 'build ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R build:build .

      - name: Verify and build AUR package
        run: |
          sudo -u build makepkg --syncdeps --cleanbuild --clean --noconfirm
          install -d release-metadata
          cp PKGBUILD release-metadata/PKGBUILD
          sudo -u build makepkg --printsrcinfo > release-metadata/SRCINFO

      - name: Upload verified package metadata
        uses: actions/upload-artifact@v4
        with:
          name: aur-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 1

  publish-aur:
    name: Publish verified package to AUR
    needs: [resolve, verify, build]
    if: ${{ needs.verify.outputs.commit == needs.resolve.outputs.commit }}
    runs-on: ubuntu-latest

    env:
      PKGNAME: sway-session
      AUR_REPO: sway-session
      VERSION: ${{ needs.resolve.outputs.tag }}

    steps:
      - name: Download verified package metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-release-metadata
          path: release-metadata

      - name: Prepare SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_PRIVATE_KEY }}

      - name: Install pinned AUR host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          fingerprint=$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}')
          expected='SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4'
          if [ "$fingerprint" != "$expected" ]; then
            echo "Pinned AUR host-key fingerprint mismatch: $fingerprint" >&2
            exit 1
          fi

      - name: Clone AUR repo
        env:
          GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=yes"
          SSH_AUTH_SOCK: ${{ env.SSH_AUTH_SOCK }}
        run: |
          git clone ssh://aur@aur.archlinux.org/${AUR_REPO}.git aur

      - name: Reject stale package metadata
        env:
          CURRENT_METADATA_DIR: aur
          ALLOW_EMPTY_AUR: 'true'
          ALLOW_EQUAL_CHANGES: 'false'
        run: &package-version-guard |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess

          def read_file(path):
              try:
                  mode = path.lstat().st_mode
              except FileNotFoundError:
                  return None
              if not stat.S_ISREG(mode):
                  raise ValueError(f'{path} must be a regular file')
              with path.open('rb') as stream:
                  data = stream.read(1024 * 1024 + 1)
              if len(data) > 1024 * 1024:
                  raise ValueError(f'{path} exceeds the metadata size limit')
              return data

          def version(data):
              if data is None:
                  raise ValueError('missing .SRCINFO')
              fields, names = {}, []
              for line in data.decode('utf-8').splitlines():
                  line = line.strip()
                  if not line or line.startswith('#'):
                      continue
                  key, separator, value = line.partition('=')
                  key, value = key.strip(), value.strip()
                  if not separator or not value or not re.fullmatch(r'[a-z][a-z0-9_]*', key):
                      raise ValueError('malformed .SRCINFO field')
                  if key == 'pkgname':
                      names.append(value)
                  elif key in ('pkgbase', 'epoch', 'pkgver', 'pkgrel'):
                      if names or key in fields or key != 'pkgbase' and 'pkgbase' not in fields:
                          raise ValueError(f'duplicate or misplaced .SRCINFO {key}')
                      fields[key] = value
              if fields.get('pkgbase') != 'sway-session' or names != ['sway-session']:
                  raise ValueError('unexpected package identity')
              epoch = fields.get('epoch', '0')
              pkgver, pkgrel = fields.get('pkgver', ''), fields.get('pkgrel', '')
              if not re.fullmatch(r'[0-9]+', epoch) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+)*', pkgver):
                  raise ValueError('unsupported package epoch or version')
              if not re.fullmatch(r'[0-9]+(?:\.[0-9]+)?', pkgrel) or int(pkgrel.split('.')[0]) < 1:
                  raise ValueError('unsupported package revision')
              return (int(epoch), tuple(map(int, pkgver.split('.'))), tuple(map(int, pkgrel.split('.')))), pkgver

          try:
              requested = os.environ['VERSION']
              if not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', requested):
                  raise ValueError('malformed resolved release tag')
              incoming_info = read_file(Path('release-metadata/SRCINFO'))
              incoming_recipe = read_file(Path('release-metadata/PKGBUILD'))
              incoming, pkgver = version(incoming_info)
              if incoming_recipe is None or pkgver != requested[1:]:
                  raise ValueError('incoming metadata does not match the resolved release tag')
              target = Path(os.environ['CURRENT_METADATA_DIR'])
              current_info = read_file(target / '.SRCINFO')
              current_recipe = read_file(target / 'PKGBUILD')
              if current_info is None or current_recipe is None:
                  if current_info is not None or current_recipe is not None or os.environ['ALLOW_EMPTY_AUR'] != 'true':
                      raise ValueError('existing package metadata is incomplete')
                  refs = subprocess.run(['git', '-C', str(target), 'for-each-ref', '--format=%(refname)'],
                                        check=True, capture_output=True, text=True, timeout=10).stdout
                  if refs.strip():
                      raise ValueError('existing repository has no package metadata')
              else:
                  current, _ = version(current_info)
                  if incoming < current:
                      raise ValueError('release would downgrade the existing package version')
                  if incoming == current and os.environ['ALLOW_EQUAL_CHANGES'] != 'true' and (
                          incoming_info != current_info or incoming_recipe != current_recipe):
                      raise ValueError('changed metadata for a published version requires a package revision')
          except (OSError, UnicodeError, ValueError, subprocess.SubprocessError) as error:
              raise SystemExit(f'Package version guard rejected metadata: {error}')
          print('Package metadata version accepted.')
          PY

      - name: Commit & push to AUR
        env:
          GIT_AUTHOR_NAME: ${{ secrets.AUR_COMMIT_NAME || 'github-actions[bot]' }}
          GIT_AUTHOR_EMAIL: ${{ secrets.AUR_COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
          GIT_COMMITTER_NAME: ${{ secrets.AUR_COMMIT_NAME || 'github-actions[bot]' }}
          GIT_COMMITTER_EMAIL: ${{ secrets.AUR_COMMIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}
        run: |
          ver="${VERSION#v}"
          cp release-metadata/PKGBUILD aur/PKGBUILD
          cp release-metadata/SRCINFO aur/.SRCINFO
          cd aur
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push."
            exit 0
          fi
          git commit -m "Release ${PKGNAME} ${ver}"
          git push origin HEAD:master

  sync-pkgbuild:
    name: Open repository metadata sync PR
    needs: [resolve, publish-aur]
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.resolve.outputs.tag }}

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified package metadata
        uses: actions/download-artifact@v4
        with:
          name: aur-release-metadata
          path: release-metadata

      - name: Reject stale repository metadata
        env:
          CURRENT_METADATA_DIR: '.'
          ALLOW_EMPTY_AUR: 'false'
          ALLOW_EQUAL_CHANGES: 'true'
        run: *package-version-guard

      - name: Update exact release metadata and open PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'RELEASE_SYNC_TOKEN is required to create the metadata sync PR.' >&2
            exit 1
          fi

          ver="${VERSION#v}"
          branch="automation/aur-${VERSION}"

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          gh auth setup-git

          if cmp -s release-metadata/PKGBUILD PKGBUILD && \
            cmp -s release-metadata/SRCINFO .SRCINFO; then
            echo "Exact package metadata for ${VERSION} is already on main."
            exit 0
          fi

          remote_sha=
          if git fetch origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" 2>/dev/null; then
            remote_sha=$(git rev-parse "refs/remotes/origin/${branch}")
          fi

          git checkout -B "$branch" origin/main
          cp release-metadata/PKGBUILD PKGBUILD
          cp release-metadata/SRCINFO .SRCINFO
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "Exact package metadata for ${VERSION} is already committed."
            exit 0
          fi
          git commit -m "chore: sync Arch package for ${VERSION}"

          if [ -n "$remote_sha" ] && \
            [ "$(git rev-parse 'HEAD^{tree}')" = \
              "$(git rev-parse "${remote_sha}^{tree}")" ]; then
            echo "Remote metadata branch already has the exact desired tree."
          elif [ -n "$remote_sha" ]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              -u origin "HEAD:refs/heads/${branch}"
          else
            git push -u origin "$branch"
          fi

          pr_url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url')
          if [ -n "$pr_url" ]; then
            echo "Metadata sync PR already exists: $pr_url"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync Arch package for ${VERSION}" \
            --body "Synchronizes the exact PKGBUILD and .SRCINFO used to build and publish sway-session ${ver} to the AUR. The package passed makepkg before publication."

  verify-release-sync-token:
    name: Verify release-sync token permissions
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'verify-sync-token' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout main without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Push probe branch and open probe PR
        id: probe
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'RELEASE_SYNC_TOKEN is required to verify release-sync permissions.' >&2
            exit 1
          fi

          branch="automation/release-sync-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          marker="release-sync-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          gh auth setup-git
          git checkout -b "$branch" origin/main
          printf '%s\n' \
            'Temporary permission probe. This branch and its PR are removed by the workflow.' \
            > "$marker"
          git add "$marker"
          git commit -m 'test: verify release-sync token permissions'
          printf 'probe_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title 'test: verify release-sync token permissions' \
            --body 'Temporary automated permission probe. The workflow closes this PR and deletes its branch immediately.')
          printf 'pr_url=%s\n' "$pr_url" >> "$GITHUB_OUTPUT"
          test "$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN

      - name: Require unattended pull-request checks
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_BRANCH: ${{ steps.probe.outputs.branch }}
        run: |
          deadline=$((SECONDS + 120))
          run_id=
          while [ -z "$run_id" ] && [ "$SECONDS" -lt "$deadline" ]; do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --event pull_request \
              --branch "$PROBE_BRANCH" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              sleep 5
            fi
          done
          if [ -z "$run_id" ]; then
            echo 'The probe PR did not trigger the normal pull-request workflow.' >&2
            exit 1
          fi
          timeout 10m gh run watch "$run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status

      - name: Close probe PR and delete probe branch
        if: ${{ always() && steps.probe.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          PROBE_BRANCH: ${{ steps.probe.outputs.branch }}
          PROBE_PR_URL: ${{ steps.probe.outputs.pr_url }}
          PROBE_SHA: ${{ steps.probe.outputs.probe_sha }}
        run: |
          status=0
          gh auth setup-git

          remote_ref=
          if ! remote_ref=$(git ls-remote --heads origin \
            "refs/heads/$PROBE_BRANCH"); then
            echo "Unable to inspect probe branch $PROBE_BRANCH during cleanup." >&2
            status=1
          fi
          remote_sha=$(printf '%s\n' "$remote_ref" | awk 'NR == 1 { print $1 }')

          pr_url=$PROBE_PR_URL
          if [ -n "$remote_sha" ] && [ "$remote_sha" != "$PROBE_SHA" ]; then
            echo "Refusing to close or delete probe state at unexpected commit $remote_sha." >&2
            status=1
          elif [ -n "$remote_sha" ]; then
            if [ -z "$pr_url" ]; then
              pr_url=$(gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --head "$PROBE_BRANCH" \
                --state open \
                --json url \
                --jq '.[0].url') || status=$?
            fi
            if git push \
              --force-with-lease="refs/heads/${PROBE_BRANCH}:${PROBE_SHA}" \
              origin ":refs/heads/${PROBE_BRANCH}"; then
              if [ -n "$pr_url" ]; then
                pr_state=$(gh pr view "$pr_url" \
                  --repo "$GITHUB_REPOSITORY" \
                  --json state \
                  --jq .state) || status=$?
                if [ "$pr_state" = OPEN ]; then
                  gh pr close "$pr_url" --repo "$GITHUB_REPOSITORY" || status=$?
                elif [ "$pr_state" != CLOSED ]; then
                  echo "Probe PR has unexpected state: $pr_state" >&2
                  status=1
                fi
              fi
            else
              status=$?
            fi
          fi
          exit "$status"
