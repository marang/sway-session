name: Verify exact commit

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
    outputs:
      commit:
        description: Commit that passed every verification step
        value: ${{ jobs.verify.outputs.commit }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.verified.outputs.commit }}
    env:
      VERIFY_COMMIT: ${{ inputs.commit }}
    steps:
      # Historical recovery targets may predate the profiling/proof helpers.
      # Stage them from the immutable caller workflow source before checking
      # out the requested application commit; never fetch mutable main here.
      - name: Checkout immutable workflow tooling without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Stage verification tooling
        run: |
          mkdir -p "$RUNNER_TEMP/verification-tooling"
          cp scripts/verify-profile.py "$RUNNER_TEMP/verification-tooling/verify-profile.py"
          cp scripts/release-gate/verification_proof.py "$RUNNER_TEMP/verification-tooling/verification_proof.py"

      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Require exact checkout
        run: |
          [[ "$VERIFY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$VERIFY_COMMIT"

      - name: Setup Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: cache-paths
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'tools=%s/bin/staticcheck\n' "$(go env GOPATH)" >> "$GITHUB_OUTPUT"

      - name: Restore module downloads
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.modules }}
          key: modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}

      # Go's compiled cache changes with source and includes race builds. A
      # unique primary key lets each successful run save its updated contents;
      # a stable prefix restores the most recent compatible successful run.
      - name: Restore compiled and race cache
        id: compiled
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.build }}
          key: build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Restore staticcheck binary
        id: staticcheck
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.tools }}
          key: staticcheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-v0.7.0

      - name: Install staticcheck
        if: steps.staticcheck.outputs.cache-hit != 'true'
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: Install verification tools
        run: sudo apt-get update && sudo apt-get install --yes fish jq zsh python3-yaml

      - name: Diagnose executable fixture paths
        run: |
          for path in /usr/bin/pkexec /usr/bin/sudo /usr/bin/true /usr/bin/false; do
            if test -e "$path" || test -L "$path"; then
              namei -l -- "$path"
              readlink -e -- "$path"
            else
              printf '%s: unavailable\n' "$path"
            fi
          done

      - name: Verify
        run: python3 -B "$RUNNER_TEMP/verification-tooling/verify-profile.py" --output "$RUNNER_TEMP/verify-profile"

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.18.2"
          args: check

      - name: Save module downloads
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.modules }}
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - name: Save updated compiled and race cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.build }}
          key: ${{ steps.compiled.outputs.cache-primary-key }}

      - name: Save staticcheck binary
        if: steps.staticcheck.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.tools }}
          key: ${{ steps.staticcheck.outputs.cache-primary-key }}

      - name: Create verification proof
        run: python3 -B "$RUNNER_TEMP/verification-tooling/verification_proof.py" create --commit "$VERIFY_COMMIT" --output "$RUNNER_TEMP/verification-proof.json"

      - name: Upload verification proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-proof-${{ inputs.commit }}
          path: ${{ runner.temp }}/verification-proof.json
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload verification profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-profile-${{ inputs.commit }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-profile
          retention-days: 14
          if-no-files-found: warn

      - name: Record verified commit
        id: verified
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFY_COMMIT"
          printf 'commit=%s\n' "$VERIFY_COMMIT" >> "$GITHUB_OUTPUT"
