version: 2

project_name: sway-title-animator

before:
  hooks:
    - go mod tidy

builds:
  - id: sway-title-animator
    main: ./cmd/sway-title-animator
    binary: sway-title-animator
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
  - id: sway-session
    main: ./cmd/sway-session
    binary: sway-session
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: bundles
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - config.example.toml
      - contrib/sway/45-title-animator.conf
      - contrib/herdr/config.toml
      - contrib/sway-session/config.toml
      - contrib/codex/hooks.json
      - contrib/codex/hooks-system.json
      - contrib/apparmor/codex-home-guard
      - contrib/completions/bash/sway-session
      - contrib/completions/zsh/_sway-session
      - contrib/completions/fish/sway-session.fish
      - scripts/verify-codex-boundary.sh

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    package_name: sway-title-animator
    ids: [sway-title-animator, sway-session]
    formats: [deb, rpm]
    maintainer: "sway-title-animator Authors"
    description: "Animated Unicode titlebars for Sway"
    homepage: "https://github.com/marang/sway-title-animator"
    license: "MIT"
    bindir: /usr/bin
    dependencies:
      - sway
    recommends:
      - pulseaudio-utils
      - alacritty
      - flatpak
      - apparmor
      - python3
    suggests:
      - foot
    overrides:
      deb:
        recommends:
          - pulseaudio-utils
          - alacritty
          - herdr (>= 0.8.2)
          - flatpak
          - apparmor
          - python3
          - libglib2.0-bin
      rpm:
        recommends:
          - pulseaudio-utils
          - alacritty
          - herdr >= 0.8.2
          - flatpak
          - apparmor
          - python3
          - glib2
    contents:
      - src: ./README.md
        dst: /usr/share/doc/sway-title-animator/README.md
      - src: ./LICENSE
        dst: /usr/share/doc/sway-title-animator/LICENSE
      - src: ./config.example.toml
        dst: /usr/share/doc/sway-title-animator/config.example.toml
      - src: ./contrib/sway/45-title-animator.conf
        dst: /usr/share/doc/sway-title-animator/45-title-animator.conf
      - src: ./contrib/herdr/config.toml
        dst: /usr/share/doc/sway-title-animator/contrib/herdr/config.toml
      - src: ./contrib/sway-session/config.toml
        dst: /usr/share/doc/sway-title-animator/contrib/sway-session/config.toml
      - src: ./contrib/codex/hooks-system.json
        dst: /usr/share/doc/sway-title-animator/contrib/codex/hooks.json
      - src: ./contrib/apparmor/codex-home-guard
        dst: /usr/share/doc/sway-title-animator/contrib/apparmor/codex-home-guard
      - src: ./scripts/verify-codex-boundary.sh
        dst: /usr/share/doc/sway-title-animator/scripts/verify-codex-boundary.sh
        file_info:
          mode: 0755
      - src: ./contrib/completions/bash/sway-session
        dst: /usr/share/bash-completion/completions/sway-session
      - src: ./contrib/completions/zsh/_sway-session
        dst: /usr/share/zsh/vendor-completions/_sway-session
        packager: deb
      - src: ./contrib/completions/zsh/_sway-session
        dst: /usr/share/zsh/site-functions/_sway-session
        packager: rpm
      - src: ./contrib/completions/fish/sway-session.fish
        dst: /usr/share/fish/vendor_completions.d/sway-session.fish

release:
  github:
    owner: marang
    name: sway-title-animator
