version: 2

project_name: sway-session

before:
  hooks:
    - go mod tidy

builds:
  - id: sway-session
    main: ./cmd/sway-session
    binary: sway-session
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: bundles
    ids: [sway-session]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/branding.md
      - docs/agent-reporting.md
      - docs/assets/*.jpeg
      - docs/sway-session-plan.md
      - docs/sway-session-verification.md
      - docs/releasing.md
      - docs/workflow_conventions.md
      - docs/adr/0001-sqlite-session-runtime-state.md
      - contrib/sway/50-sway-session.conf
      - contrib/herdr/config.toml
      - contrib/sway-session/config.toml
      - contrib/codex/hooks.json
      - contrib/codex/hooks-system.json
      - contrib/codex/report-agent-session.sh
      - contrib/apparmor/agent-home-guard
      - contrib/completions/bash/sway-session
      - contrib/completions/zsh/_sway-session
      - contrib/completions/fish/sway-session.fish
      - scripts/verify-codex-boundary.sh

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    package_name: sway-session
    ids: [sway-session]
    formats: [deb, rpm]
    maintainer: "sway-session Authors"
    description: "Persistent work sessions for Sway"
    homepage: "https://github.com/marang/sway-session"
    license: "MIT"
    bindir: /usr/bin
    dependencies:
      - sway
    contents:
      - src: ./README.md
        dst: /usr/share/doc/sway-session/README.md
      - src: ./docs/branding.md
        dst: /usr/share/doc/sway-session/docs/branding.md
      - src: ./docs/agent-reporting.md
        dst: /usr/share/doc/sway-session/docs/agent-reporting.md
      - src: ./docs/assets/*.jpeg
        dst: /usr/share/doc/sway-session/docs/assets/
      - src: ./LICENSE
        dst: /usr/share/doc/sway-session/LICENSE
      - src: ./docs/sway-session-plan.md
        dst: /usr/share/doc/sway-session/docs/sway-session-plan.md
      - src: ./docs/sway-session-verification.md
        dst: /usr/share/doc/sway-session/docs/sway-session-verification.md
      - src: ./docs/releasing.md
        dst: /usr/share/doc/sway-session/docs/releasing.md
      - src: ./docs/workflow_conventions.md
        dst: /usr/share/doc/sway-session/docs/workflow_conventions.md
      - src: ./docs/adr/0001-sqlite-session-runtime-state.md
        dst: /usr/share/doc/sway-session/docs/adr/0001-sqlite-session-runtime-state.md
      - src: ./contrib/sway/50-sway-session.conf
        dst: /usr/share/doc/sway-session/50-sway-session.conf
      - src: ./contrib/herdr/config.toml
        dst: /usr/share/doc/sway-session/contrib/herdr/config.toml
      - src: ./contrib/sway-session/config.toml
        dst: /usr/share/doc/sway-session/contrib/sway-session/config.toml
      - src: ./contrib/codex/hooks-system.json
        dst: /usr/share/doc/sway-session/contrib/codex/hooks.json
      - src: ./contrib/codex/report-agent-session.sh
        dst: /usr/lib/sway-session/codex-report-agent-session
        file_info:
          mode: 0755
      - src: ./contrib/apparmor/agent-home-guard
        dst: /usr/share/doc/sway-session/contrib/apparmor/agent-home-guard
      - src: ./scripts/verify-codex-boundary.sh
        dst: /usr/share/doc/sway-session/scripts/verify-codex-boundary.sh
        file_info:
          mode: 0755
      - src: ./contrib/completions/bash/sway-session
        dst: /usr/share/bash-completion/completions/sway-session
      - src: ./contrib/completions/zsh/_sway-session
        dst: /usr/share/zsh/vendor-completions/_sway-session
        packager: deb
      - src: ./contrib/completions/zsh/_sway-session
        dst: /usr/share/zsh/site-functions/_sway-session
        packager: rpm
      - src: ./contrib/completions/fish/sway-session.fish
        dst: /usr/share/fish/vendor_completions.d/sway-session.fish

release:
  github:
    owner: marang
    name: sway-session
