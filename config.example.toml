[settings]
fps = 25
motion = 0.22
approx_char_width = 8.5
max_art_columns = 220
title_reserve_columns = 18
rotation_hold_frames = 260
rotation_blend_frames = 75
detect_child_process = true

[audio]
# device = "@DEFAULT_MONITOR@"
sensitivity = 1.0
motion = 1.0

[rotation]
presets = [
  "loom",
  "aurora",
  "bloom",
  "spectrum",
  "square",
  "ripples",
  "radar",
  "constellation",
  "circuit",
  "glitch",
  "braid",
  "comet",
  "smileys",
  "wave",
  "spline",
]

# Application persistence indicators are emitted by sway-session daemon and
# rendered immediately before the app icon by the independent title animator.
# Defaults are single-column glyphs available in Noto Sans Mono.
[indicators]
unregistered = "○"
pending = "◔"
registered = "●"
pinned = "▲"

[glyphs]
aurora_bars = "▁▂▃▄▅▆▇█"
aurora_dots = "·∙•"
aurora_sparkles = "✦✧"
shade_ramp = " ·░▒▓█"
spectrum_bars = "▁▂▃▄▅▆▇█"
spectrum_left = "⟨([{<"
spectrum_right = ">}])⟩"
radar_levels = " ·┄─═●"
radar_sweep = "◜◠◝◞◡◟"
constellation_stars = "✦✧✶✷"
circuit_tiles = "─╴╶═╡╞╪┄╍╾╼"
comet_trail = "·░▒▓"

[icons]
alacritty = "▣"
firefox = "🌐"
riotbox = "♪"
