# Sway titlebar animation. Works best in tabbed/stacked layouts, but applies to
# regular titlebars too.
exec_always --no-startup-id /usr/bin/sway-title-animator --replace --fps 25

# Serve the owner-only typed start endpoint used by the confined Codex client.
# The terminal, pane shell, and agent started through it are currently
# unconfined; see LAB-89 before treating this as a complete security boundary.
exec --no-startup-id /usr/bin/sway-session broker

# Restore registered work contexts once when Sway starts. Deliberately use
# exec, not exec_always: a config reload must not request another restore.
exec --no-startup-id /usr/bin/sway-session restore
