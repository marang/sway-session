# Sway titlebar animation. Works best in tabbed/stacked layouts, but applies to
# regular titlebars too.
exec_always --no-startup-id /usr/bin/sway-title-animator --replace --fps 25

# Observe registered windows, persist and restore their outer Sway layout, and
# serve the two existing owner-only typed endpoints. The terminal, pane shell,
# and agent started through the request endpoint are currently unconfined; see
# LAB-89 before treating this as a complete security boundary.
exec --no-startup-id /usr/bin/sway-session daemon

# Restore registered work contexts once when Sway starts. Deliberately use
# exec, not exec_always: a config reload must not request another restore.
# Window placement and layout reconstruction are then coordinated by the
# independent sway-session daemon above, never by the title animator.
exec --no-startup-id /usr/bin/sway-session restore

# Optional explicit desktop-app registration. Repeating the chord on an
# already registered app shows/repairs status; it never unregisters it. After
# the first successful registration, title indicators mean: ○ unregistered,
# ◔ awaiting approval, ● registered/follow, and ▲ pinned/autostart.
# Uncomment only if this chord is unused in the rest of your Sway config.
# bindsym $mod+Ctrl+p exec --no-startup-id /usr/bin/sway-session app register-focused
