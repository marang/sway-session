# Sway titlebar animation. Works best in tabbed/stacked layouts, but applies to
# regular titlebars too.
exec_always --no-startup-id sway-title-animator --replace --fps 25

# Restore registered work contexts once when Sway starts. Deliberately use
# exec, not exec_always: a config reload must not request another restore.
exec --no-startup-id sway-session restore
