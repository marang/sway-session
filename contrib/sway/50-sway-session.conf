# This manual template can live under ~/.config/sway/config.d/ and be included
# by the main configuration. Doctor creates its own managed file there when
# config.d exists; remove these manual starts before adopting Doctor integration.
# Start the owner-only session daemon and request one initial restore when the
# Sway session starts. These are deliberately one-time startup commands: config
# reloads must not start another daemon or request another restore.
exec --no-startup-id /usr/bin/sway-session daemon
exec --no-startup-id /usr/bin/sway-session restore

# Optional terminal shortcuts. Define $mod before this file is included,
# replace conflicting bindings, then uncomment both lines to opt in.
# bindsym $mod+Return exec --no-startup-id /usr/bin/sway-session terminal --new
# bindsym $mod+Shift+Return exec --no-startup-id /usr/bin/sway-session terminal --ephemeral

# Optional explicit desktop-app registration. Choose an otherwise unused chord.
# bindsym $mod+Ctrl+p exec --no-startup-id /usr/bin/sway-session app register-focused
